# Replaces .travis.yml. Travis ran xcodebuild test on Xcode 7.3 / iOS 9.3 simulator (no longer exists)
# and 'pod lib lint'. Only the lint is kept; this repo never published from Travis.
name: Pod lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: pod lib lint
        run: pod lib lint --allow-warnings
